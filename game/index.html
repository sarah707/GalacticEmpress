<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <title>女皇的银河</title>
  <style>
    :root {
      --ink:#0b3655; --muted:#56758b; --blue:#087fb7; --cyan:#43d5ee; --violet:#7688ff;
      --line:rgba(43,166,211,.32); --glass:rgba(241,252,255,.91); --glass-strong:rgba(250,254,255,.96); --deep:#031b31;
      --danger:#9a3653; --ok:#197b73; --shadow:0 20px 54px rgba(5,48,78,.2);
      font-family:"Noto Sans SC","Microsoft YaHei",system-ui,sans-serif;
      color:var(--ink); background:#eaf8ff; font-size:15px;
    }
    *{box-sizing:border-box} html,body{width:100%;height:100%;margin:0;overflow:hidden} body{display:flex;flex-direction:column} #app{position:relative;flex:1;min-height:0;width:100%;overflow:hidden}
    button,input,textarea,select{font:inherit;color:inherit} button{touch-action:manipulation}
    .shell{position:relative;isolation:isolate;height:100%;display:flex;flex-direction:column;background:
      radial-gradient(circle at 84% -8%,rgba(71,217,241,.34),transparent 34%),
      radial-gradient(circle at 4% 74%,rgba(113,134,255,.14),transparent 31%),
      linear-gradient(155deg,#f7fdff 0%,#e2f3f9 49%,#cfe7f1 100%)}
    .shell:before{content:"";position:absolute;z-index:-1;inset:0;pointer-events:none;opacity:.42;background-image:
      linear-gradient(rgba(20,132,177,.09) 1px,transparent 1px),linear-gradient(90deg,rgba(20,132,177,.09) 1px,transparent 1px);
      background-size:28px 28px;mask-image:linear-gradient(180deg,rgba(0,0,0,.74),transparent 74%)}
    .shell:after{content:"";position:absolute;z-index:-1;inset:0;pointer-events:none;background:
      radial-gradient(circle at 18% 22%,rgba(255,255,255,.96) 0 1px,transparent 1.5px),
      radial-gradient(circle at 73% 41%,rgba(29,172,218,.42) 0 1px,transparent 1.7px),
      radial-gradient(circle at 42% 78%,rgba(107,123,238,.28) 0 1px,transparent 1.6px);background-size:83px 79px,109px 101px,127px 113px;opacity:.58}
    .title-safe,.viewport,.bottom-nav{position:relative;z-index:1}
    .title-safe{position:relative;z-index:55;flex:0 0 auto;padding:15px 60px 13px 20px;text-align:center;color:#ecfbff;
      font-size:22px;font-weight:850;letter-spacing:.14em;text-shadow:0 0 18px rgba(112,231,255,.62);background:
      linear-gradient(90deg,transparent 0 8%,rgba(99,225,247,.13) 8% 8.4%,transparent 8.4% 92%,rgba(99,225,247,.13) 92% 92.4%,transparent 92%),
      linear-gradient(120deg,#031d36,#075b7c 57%,#0b819f);
      border-bottom:1px solid rgba(94,226,249,.72);box-shadow:0 5px 24px rgba(2,40,68,.34),inset 0 -1px 0 rgba(255,255,255,.12);cursor:grab;user-select:none}
    .title-safe:before{content:"";position:absolute;inset:0;background:linear-gradient(104deg,transparent 20%,rgba(124,235,252,.18) 47%,transparent 74%);transform:translateX(-100%);animation:title-scan 7s ease-in-out infinite;pointer-events:none}
    .title-safe:after{content:"◆  GALACTIC EMPRESS";position:absolute;left:18px;bottom:5px;color:rgba(192,241,252,.68);font-size:8px;font-weight:650;letter-spacing:.17em;text-shadow:none;pointer-events:none}
    @keyframes title-scan{0%,64%{transform:translateX(-100%)}84%,100%{transform:translateX(100%)}}
    .viewport{flex:1;min-height:0;overflow:auto;padding:14px 14px 92px;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
    .screen-center{min-height:100%;display:grid;place-items:center;padding:22px}
    .intro-panel,.setup-panel,.panel{position:relative;width:100%;overflow:hidden;border:1px solid rgba(47,178,218,.42);border-radius:9px 20px 9px 20px;background:linear-gradient(145deg,var(--glass-strong),var(--glass));box-shadow:var(--shadow),inset 0 1px 0 rgba(255,255,255,.82);backdrop-filter:blur(14px)}
    .intro-panel:before,.setup-panel:before,.panel:before{content:"";position:absolute;inset:0;pointer-events:none;background:
      linear-gradient(90deg,var(--cyan),transparent 44%) top left/55% 2px no-repeat,
      linear-gradient(180deg,var(--cyan),transparent 45%) top left/2px 48% no-repeat,
      linear-gradient(270deg,rgba(118,136,255,.65),transparent 44%) bottom right/48% 1px no-repeat}
    .intro-panel,.setup-panel{max-width:470px;padding:28px}.intro-copy{white-space:pre-line;text-align:center;line-height:2;font-size:16px}
    h1,h2,h3,p{margin-top:0} h2{font-size:20px;color:#075c87;letter-spacing:.035em;text-shadow:0 0 18px rgba(59,188,226,.18)} h3{font-size:16px;color:#116589;letter-spacing:.02em}
    .field{display:grid;gap:7px;margin:0 0 15px}.field label{font-weight:750}.field input,.field textarea,.field select{
      width:100%;border:1px solid rgba(40,157,199,.38);border-radius:7px 13px 7px 13px;padding:11px 12px;background:linear-gradient(135deg,rgba(255,255,255,.96),rgba(235,249,253,.9));box-shadow:inset 0 1px 3px rgba(4,55,84,.06);outline:none}
    .field textarea{min-height:88px;resize:vertical}.field input:focus,.field textarea:focus,.field select:focus{border-color:#32a7d2;box-shadow:0 0 0 3px rgba(62,183,222,.13)}
    .btn{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:42px;overflow:hidden;border:1px solid rgba(102,226,247,.44);border-radius:6px 13px 6px 13px;padding:10px 15px;font-weight:780;letter-spacing:.025em;cursor:pointer;
      color:white;background:linear-gradient(135deg,#075c91,#0b8caf 62%,#27b9c8);box-shadow:0 7px 18px rgba(8,103,145,.24),inset 0 1px 0 rgba(255,255,255,.18);transition:.16s transform,.16s opacity,.16s box-shadow}
    .btn:before{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.22),transparent 70%);transform:translateX(-120%);transition:transform .38s ease;pointer-events:none}.btn:hover:before{transform:translateX(120%)}
    .btn:hover{transform:translateY(-1px);box-shadow:0 9px 24px rgba(8,103,145,.29),0 0 0 1px rgba(72,214,238,.16)}.btn:active{transform:translateY(0)}.btn.secondary{color:#145b7c;background:linear-gradient(135deg,#fff,#ecf9fc);border:1px solid var(--line);box-shadow:inset 0 1px 0 #fff}
    .btn.danger{background:linear-gradient(135deg,#9c4161,#c05a72)}.btn.ghost{color:#176888;background:rgba(255,255,255,.48);border:1px solid var(--line);box-shadow:none}
    .btn:disabled,.disabled{opacity:.42!important;cursor:not-allowed!important;transform:none!important;filter:saturate(.65)}.wide{width:100%}.actions{display:flex;flex-wrap:wrap;gap:9px}
    .topbar{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;margin-bottom:12px}.stat,.sector{position:relative;overflow:hidden;padding:11px;border:1px solid rgba(52,176,218,.35);border-radius:7px 14px 7px 14px;background:linear-gradient(145deg,rgba(255,255,255,.9),rgba(224,245,251,.72));box-shadow:inset 0 1px 0 rgba(255,255,255,.92),0 6px 16px rgba(8,81,115,.08)}
    .stat:before{content:"";position:absolute;left:0;top:22%;width:3px;height:56%;border-radius:0 4px 4px 0;background:var(--cyan);box-shadow:0 0 10px rgba(38,201,229,.8)}
    .stat{display:flex;justify-content:space-between;gap:8px;font-weight:790}.stat span{font-size:12.5px;letter-spacing:.06em}.stat strong{color:#075d88;font-variant-numeric:tabular-nums;text-shadow:0 0 14px rgba(42,187,224,.2)}.stat-button{width:100%;text-align:left;cursor:pointer}.stat-button:hover{border-color:rgba(44,193,224,.68)}
    .sector{grid-column:1/-1;line-height:1.55;background:linear-gradient(90deg,rgba(225,247,252,.94),rgba(248,253,255,.85),rgba(230,242,255,.76))}.sector:after{content:"";position:absolute;right:-24px;top:50%;width:70px;height:70px;border:1px solid rgba(54,184,220,.18);border-radius:50%;transform:translateY(-50%);box-shadow:0 0 0 8px rgba(54,184,220,.06),0 0 0 17px rgba(103,122,239,.035)}.sector strong{color:#08688f;letter-spacing:.04em}
    .attack{grid-column:1/-1;letter-spacing:.08em}.content-panel{padding:15px}.character-list{display:grid;gap:13px}.character-card{position:relative;display:grid;grid-template-columns:116px 1fr;gap:14px;overflow:hidden;padding:14px;
      border:1px solid rgba(49,164,204,.32);border-radius:8px 18px 8px 18px;background:linear-gradient(145deg,rgba(255,255,255,.94),rgba(234,248,252,.8));box-shadow:0 9px 26px rgba(10,77,109,.11),inset 0 1px 0 #fff;transition:transform .18s ease,border-color .18s ease}
    .character-card:before{content:"";position:absolute;left:0;top:0;width:44%;height:2px;background:linear-gradient(90deg,var(--cyan),transparent);box-shadow:0 0 9px rgba(54,203,230,.55)}.character-card:hover{transform:translateY(-1px);border-color:rgba(49,178,216,.5)}
    .character-card.dead{filter:grayscale(.6)}.dead-mark{position:absolute;right:12px;top:12px;padding:4px 8px;border-radius:999px;color:#fff;background:var(--danger);font-size:12px;font-weight:800}
    .avatar{width:116px;aspect-ratio:1;border-radius:6px 15px 6px 15px;object-fit:cover;background:linear-gradient(135deg,#d4f1fb,#a8d9ec);border:1px solid rgba(67,205,233,.6);box-shadow:0 0 0 3px rgba(62,195,224,.08),0 6px 18px rgba(7,74,106,.16)}
    .avatar-preview-trigger{display:block;width:116px;padding:0;border:0;border-radius:6px 15px 6px 15px;background:transparent;cursor:zoom-in}.avatar-preview-trigger:focus-visible{outline:3px solid #168cad;outline-offset:3px}.avatar-preview-trigger .avatar{display:block}
    .avatar-placeholder{width:116px;aspect-ratio:1;display:grid;place-items:center;border-radius:6px 15px 6px 15px;color:#3f86a4;font-size:34px;text-shadow:0 0 14px rgba(49,192,224,.4);background:linear-gradient(135deg,#e8f9ff,#c6e8f5);border:1px solid rgba(67,205,233,.6);box-shadow:0 0 0 3px rgba(62,195,224,.08)}
    .avatar-actions{display:grid;gap:6px;margin-top:7px}.mini{min-height:31px;padding:5px 7px;font-size:12px;border-radius:8px}.character-info h3{margin:0 0 7px;font-size:18px}.meters{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:8px}
    .meter{font-size:12px}.bar{height:8px;margin-top:3px;border:1px solid rgba(34,130,169,.1);border-radius:999px;background:#d6e8ef;box-shadow:inset 0 1px 2px rgba(4,47,73,.12);overflow:hidden}.bar>i{display:block;height:100%;background:linear-gradient(90deg,#5bdaf0,#1883ba);box-shadow:0 0 9px rgba(47,191,225,.58)}
    .bar.health>i{background:linear-gradient(90deg,#66cda6,#218c76)}.detail{margin:6px 0;color:#385f78;line-height:1.55}.detail strong{color:#135979}.bio{max-height:none;overflow:visible}
    .char-actions{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}.empty{text-align:center;color:var(--muted);padding:35px 16px}.locked-note{padding:10px 12px;border-radius:11px;background:#fff8df;color:#775b16;margin-bottom:12px}
    .bottom-nav{position:absolute;left:0;right:0;bottom:0;display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:max(8px,env(safe-area-inset-bottom)) 9px 9px;
      background:linear-gradient(180deg,rgba(8,54,79,.88),rgba(3,27,48,.97));backdrop-filter:blur(16px);border-top:1px solid rgba(78,213,238,.54);box-shadow:0 -8px 26px rgba(4,48,75,.2),inset 0 1px 0 rgba(255,255,255,.08)}
    .nav-btn{min-height:48px;border:1px solid transparent;border-radius:5px 12px 5px 12px;color:#9fd9e9;background:transparent;font-weight:780;letter-spacing:.035em;cursor:pointer;transition:.16s background,.16s color}.nav-btn:hover{color:#e8fbff;background:rgba(76,200,226,.09)}.nav-btn.active{color:white;border-color:rgba(112,225,244,.4);background:linear-gradient(135deg,#075f92,#10a5bd);box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 0 18px rgba(32,183,211,.2)}
    .template-slots{display:grid;gap:9px}.slot{padding:12px;border:1px dashed rgba(55,170,207,.7);border-radius:6px 13px 6px 13px;background:linear-gradient(135deg,rgba(255,255,255,.78),rgba(228,246,251,.64))}.gene-grid{display:flex;flex-wrap:wrap;gap:6px}.chip{display:inline-flex;padding:4px 8px;border:1px solid rgba(52,177,212,.2);border-radius:4px 10px 4px 10px;background:linear-gradient(135deg,#dff7fc,#e8edff);color:#17617f;font-size:12px;box-shadow:inset 0 1px 0 rgba(255,255,255,.8)}
    .range-row{display:grid;grid-template-columns:1fr 94px;gap:10px;align-items:center}.range-row input[type=range]{width:100%}.range-row input[type=number]{width:100%;padding:8px;border:1px solid var(--line);border-radius:9px}
    .settings-grid{display:grid;gap:12px}.setting-card{padding:14px;border:1px solid rgba(49,165,204,.3);border-radius:7px 15px 7px 15px;background:linear-gradient(145deg,rgba(255,255,255,.86),rgba(231,247,252,.72));box-shadow:inset 0 1px 0 rgba(255,255,255,.9)}.save-row{display:grid;grid-template-columns:1fr auto auto;gap:7px;align-items:center;margin-top:8px}
    .modal-layer{position:fixed;inset:0;z-index:30;display:grid;place-items:center;padding:16px;background:rgba(2,22,39,.5)}.modal-layer.story-modal-layer{padding-top:68px}.modal-layer[hidden]{display:none}.modal{width:min(100%,530px);max-height:min(86vh,760px);display:flex;flex-direction:column;border:1px solid rgba(92,218,240,.6);border-radius:8px 20px 8px 20px;background:#f5fcff;box-shadow:0 25px 74px rgba(0,20,38,.42),0 0 0 1px rgba(86,211,235,.08),inset 0 1px 0 #fff;overflow:hidden}.story-modal-layer .modal{max-height:min(calc(100vh - 84px),760px)}
    .modal-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px;color:white;background:linear-gradient(120deg,#042b4b,#08769a 64%,#15a6b9);border-bottom:1px solid rgba(100,224,244,.58)}.modal-head h2{margin:0;color:white;text-shadow:0 0 15px rgba(109,228,247,.45)}.modal-body{padding:16px;overflow:auto;line-height:1.75;background-image:linear-gradient(rgba(28,138,178,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(28,138,178,.035) 1px,transparent 1px);background-size:24px 24px}.modal-foot{display:flex;justify-content:flex-end;gap:9px;padding:12px 16px;border-top:1px solid var(--line);background:rgba(230,247,252,.64)}
    .avatar-preview{display:grid;place-items:center}.avatar-large{display:block;max-width:100%;max-height:calc(86vh - 150px);border-radius:14px;object-fit:contain;box-shadow:0 10px 30px rgba(0,31,51,.22)}
    .story{color:#173f62;white-space:pre-wrap}.story .dialogue{color:#0878c1}.story .thought{color:#67899e;font-style:italic}.story p{margin:0 0 1em}
    .history-list{display:grid;gap:8px}.history-link{width:100%;text-align:left;border:1px solid var(--line);border-radius:10px;padding:10px;background:#fff;cursor:pointer;color:#145a7e}
    .loading-layer{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:rgba(3,28,48,.64)}.loading-layer[hidden]{display:none}.loading-card{text-align:center;padding:27px 32px;border:1px solid rgba(81,214,238,.58);border-radius:7px 18px 7px 18px;background:linear-gradient(145deg,rgba(250,254,255,.98),rgba(225,246,251,.94));box-shadow:0 23px 64px rgba(0,20,38,.38),0 0 24px rgba(53,194,222,.12)}
    .spinner{width:44px;height:44px;margin:0 auto 14px;border:3px solid rgba(64,179,213,.18);border-top-color:#20c3db;border-right-color:#7588ed;border-radius:50%;box-shadow:0 0 17px rgba(41,191,221,.22);animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
    .toasts{position:fixed;z-index:60;left:50%;top:74px;transform:translateX(-50%);width:min(90%,430px);display:grid;gap:8px;pointer-events:none}.toast{padding:11px 14px;border-radius:11px;color:white;background:#176f91;box-shadow:0 8px 22px rgba(0,40,65,.25);animation:toast-in .24s ease-out}.toast.error{background:#9a3653}.toast.ok{background:#197b73}@keyframes toast-in{from{opacity:0;transform:translateY(-8px)}}
    .frozen{padding:11px 13px;margin-bottom:12px;border:1px solid #8fc4d7;border-radius:12px;color:#235b73;background:#e7f8fe}.small{font-size:12px;color:var(--muted)}
    @media(max-width:520px){.viewport{padding:10px 9px 90px}.title-safe{font-size:18px;padding-top:12px;padding-bottom:11px}.title-safe:after{display:none}.stat{flex-direction:column;align-items:center;gap:3px;padding:9px 5px;text-align:center;font-size:12px}.stat span{font-size:11px;letter-spacing:.02em}.character-card{grid-template-columns:92px 1fr;gap:10px;padding:10px}.avatar,.avatar-placeholder,.avatar-preview-trigger{width:92px}.meters{grid-template-columns:1fr}.intro-panel,.setup-panel{padding:20px}.actions>.btn{flex:1}.modal-layer{padding:7px}.modal-layer.story-modal-layer{padding-top:56px}.modal{max-height:94vh}.story-modal-layer .modal{max-height:calc(100vh - 63px)}.avatar-large{max-height:calc(94vh - 150px)}}
    @media(prefers-reduced-motion:reduce){.title-safe:before{animation:none}.btn,.character-card{transition:none}}
  </style>
</head>
<body>
  <header class="title-safe">女皇的银河</header>
  <div id="app"></div>
  <div id="modal-layer" class="modal-layer" hidden></div>
  <div id="loading-layer" class="loading-layer" hidden><div class="loading-card"><div class="spinner"></div><strong>等待生成剧情</strong><p id="loading-note" class="small">请不要关闭或操作游戏窗口</p></div></div>
  <div id="toasts" class="toasts" aria-live="polite"></div>
  <script src="tavern-runtime.js?build=20261002223540"></script>
  <script type="module" src="game.js?build=20261002223540"></script>
</body>
</html>
